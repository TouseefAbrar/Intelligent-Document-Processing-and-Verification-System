version: "3.9"

services:
  backend:
    build: ./backend
    container_name: eef-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - eef_storage:/app/app/storage
    networks:
      - eef

  frontend:
    build: ./frontend
    container_name: eef-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - eef

networks:
  eef:

volumes:
  eef_storage:
